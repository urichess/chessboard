CONFIG_HEAP_MEM_POOL_SIZE=1048
CONFIG_ASSERT=y
CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_SHELL=y
#CONFIG_ADC_SHELL=y
#CONFIG_GPIO_SHELL=y
CONFIG_SHELL_PROMPT_UART="upgrader:~$ "

CONFIG_REBOOT=y

CONFIG_LOG=y

CONFIG_EVENTS=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y


CONFIG_BOOTLOADER_MCUBOOT=y
#CONFIG_BOOT_SIGNATURE_KEY_FILE="~/keys/mykey.pem"
